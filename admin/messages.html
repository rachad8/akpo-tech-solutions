<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../assets/logo/logo.webp">
    <meta name="theme-color" content="#3B82F6">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/animations.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/accessibility.css">
    <link rel="stylesheet" href="../assets/css/print.css">
    <link rel="stylesheet" href="../assets/css/refonte-2026.css" data-akpo-refonte>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/session-guard.js"></script>
</head>
<body>

<div class="dashboard-layout">
    <aside class="dashboard-sidebar">
        <div class="sidebar-brand"><img decoding="async" src="../assets/logo/logo.webp" alt="AKPO TECH"></div>
        <nav class="sidebar-nav">
            <a href="index.html" class="sidebar-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="clients.html" class="sidebar-link"><i class="bi bi-people"></i> Clients</a>
            <a href="services.html" class="sidebar-link"><i class="bi bi-tools"></i> Services</a>
            <a href="projects.html" class="sidebar-link"><i class="bi bi-folder"></i> Projets</a>
            <a href="invoices.html" class="sidebar-link"><i class="bi bi-receipt"></i> Factures</a>
            <a href="payments.html" class="sidebar-link"><i class="bi bi-credit-card"></i> Paiements</a>
            <a href="messages.html" class="sidebar-link active"><i class="bi bi-envelope"></i> Messages</a>
            <a href="statistiques.html" class="sidebar-link"><i class="bi bi-bar-chart"></i> Statistiques</a>
            <a href="settings.html" class="sidebar-link"><i class="bi bi-gear"></i> Paramètres</a>
        </nav>
        <button class="sidebar-logout" onclick="AkpoGuard.logout('../auth/admin-login.html')"><i class="bi bi-box-arrow-right"></i> Déconnexion</button>
    </aside>

    <main class="dashboard-main">
        <div class="dashboard-header"><h1>Messages du site</h1></div>
        <div class="dashboard-stats">
            <div class="dashboard-stat-card"><div class="dashboard-stat-icon bg-primary bg-opacity-10 text-primary"><i class="bi bi-envelope"></i></div><div><div class="dashboard-stat-value" id="statTotal">0</div><div class="dashboard-stat-label">Total messages</div></div></div>
            <div class="dashboard-stat-card"><div class="dashboard-stat-icon bg-danger bg-opacity-10 text-danger"><i class="bi bi-envelope-open"></i></div><div><div class="dashboard-stat-value" id="statNonLus">0</div><div class="dashboard-stat-label">Non lus</div></div></div>
        </div>
        <div class="dashboard-table-card"><div class="table-responsive"><table class="dashboard-table"><thead><tr><th>Date</th><th>Nom</th><th>Tél</th><th>Email</th><th>Service</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="messagesTable"></tbody></table></div></div>
    </main>
</div>

<script>

    
    
    
    let allMessages = [];

    AkpoGuard.requireAdmin(function(user, profile) {
        loadMessages();
    });

    async function loadMessages() {
        const snapshot = await db.collection('contacts').orderBy('date','desc').get();
        allMessages = []; snapshot.forEach(doc => allMessages.push({ id: doc.id, ...doc.data() }));
        document.getElementById('statTotal').textContent = allMessages.length;
        document.getElementById('statNonLus').textContent = allMessages.filter(m => !m.lu).length;
        document.getElementById('messagesTable').innerHTML = allMessages.length === 0 ? '<tr><td colspan="7" class="text-center">Aucun message</td></tr>' :
            allMessages.map(m => `<tr class="${!m.lu ? 'fw-bold' : ''}"><td>${m.date?new Date(m.date.toDate()).toLocaleDateString('fr-FR'):''}</td><td>${m.nom}</td><td>${m.téléphone}</td><td>${m.email||'-'}</td><td>${m.service}</td><td><span class="badge bg-${m.lu?'success':'danger'}">${m.lu?'Lu':'Non lu'}</span></td><td><button class="btn btn-sm btn-outline-primary" onclick="viewMessage('${m.id}')"><i class="bi bi-eye"></i></button><button class="btn btn-sm btn-outline-danger" onclick="deleteMessage('${m.id}')"><i class="bi bi-trash"></i></button></td></tr>`).join('');
    }

    async function viewMessage(id) {
        const m = allMessages.find(x => x.id === id);
        if (!m) return;
        await db.collection('contacts').doc(id).update({ lu: true });
        m.lu = true;
        loadMessages();
        alert(`Message de ${m.nom}\nTél : ${m.téléphone}\nEmail : ${m.email||'N/A'}\nService : ${m.service}\nAdresse : ${m.adresse||'N/A'}\nUrgence : ${m.urgence||'Normal'}\n\n${m.description}`);
    }

    async function deleteMessage(id) {
        if (!confirm('Supprimer ce message ?')) return;
        await db.collection('contacts').doc(id).delete();
        allMessages = allMessages.filter(m => m.id !== id);
        loadMessages();
    }
</script>
</body>
</html>
