<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Admin | AKPO TECH SOLUTIONS</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../assets/logo/logo.webp">
    <meta name="theme-color" content="#3B82F6">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="../index.html"><img decoding="async" src="../assets/logo/logo.webp" alt="AKPO TECH SOLUTIONS"></a>
      <span class="admin-badge"><i class="bi bi-shield-lock"></i> ADMINISTRATION</span>
      <h1>Créer un compte admin</h1>
      <p>Création du compte administrateur avec Firebase</p>
    </div>
    <div class="auth-message" id="authMessage"></div>
    <form id="registerForm">
      <div class="form-group"><label class="form-label" for="registerNom">Nom complet <span class="text-danger">*</span></label><input type="text" id="registerNom" class="form-control" placeholder="Votre nom complet" required></div>
      <div class="form-group"><label class="form-label" for="registerEmail">Email <span class="text-danger">*</span></label><input type="email" id="registerEmail" class="form-control" placeholder="admin@exemple.com" required></div>
      <div class="form-group"><label class="form-label" for="registerTéléphone">Téléphone</label><input type="tel" id="registerTéléphone" class="form-control" placeholder="Votre numéro"></div>
      <div class="form-group"><label class="form-label" for="adminCode">Code secret admin <span class="text-danger">*</span></label><div class="input-icon-wrapper"><input type="password" id="adminCode" class="form-control" placeholder="Code fourni par le responsable" autocomplete="off" required><button type="button" class="password-toggle" onclick="togglePass('adminCode', this)"><i class="bi bi-eye"></i></button></div></div>
      <div class="form-group"><label class="form-label" for="registerPassword">Mot de passe <span class="text-danger">*</span></label><div class="input-icon-wrapper"><input type="password" id="registerPassword" class="form-control" placeholder="Min. 6 caractères" minlength="6" required><button type="button" class="password-toggle" onclick="togglePass('registerPassword', this)"><i class="bi bi-eye"></i></button></div></div>
      <div class="form-group"><label class="form-label" for="registerPasswordConfirm">Confirmer le mot de passe <span class="text-danger">*</span></label><div class="input-icon-wrapper"><input type="password" id="registerPasswordConfirm" class="form-control" placeholder="Confirmez" minlength="6" required><button type="button" class="password-toggle" onclick="togglePass('registerPasswordConfirm', this)"><i class="bi bi-eye"></i></button></div></div>
      <button type="submit" class="auth-submit" id="registerBtn"><i class="bi bi-person-plus"></i> Créer le compte admin</button>
    </form>
    <div class="auth-footer"><a href="admin-login.html"><i class="bi bi-arrow-left"></i> Retour à la connexion admin</a><br><a href="../index.html" class="mt-2 d-inline-block">Retour au site</a></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../assets/js/session-guard.js"></script>
<script>
var authMessage = document.getElementById('authMessage');
var registerBtn = document.getElementById('registerBtn');

function togglePass(id, btn) {
    var input = document.getElementById(id);
    var icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}

function showMessage(text, type) {
    authMessage.className = 'auth-message ' + (type || 'error');
    authMessage.textContent = text;
    authMessage.style.display = 'block';
}

function hideMessage() {
    authMessage.style.display = 'none';
}

function errorMessage(error) {
    var code = error && error.code;
    if (code === 'auth/email-already-exists' || code === 'functions/already-exists') return '❌ Cet email est déjà utilisé.';
    if (code === 'auth/invalid-email') return '❌ Adresse email invalide.';
    if (code === 'auth/weak-password') return '❌ Le mot de passe doit contenir au moins 6 caractères.';
    if (code === 'auth/network-request-failed') return '❌ Erreur réseau. Vérifiez votre connexion internet.';
    return '❌ Impossible de créer le compte. Réessayez.';
}

document.getElementById('registerForm').addEventListener('submit', function (event) {
    event.preventDefault();
    hideMessage();

    var fullName = document.getElementById('registerNom').value.trim();
    var email = document.getElementById('registerEmail').value.trim().toLowerCase();
    var phone = document.getElementById('registerTéléphone').value.trim();
    var password = document.getElementById('registerPassword').value;
    var passwordConfirm = document.getElementById('registerPasswordConfirm').value;
    var adminCode = document.getElementById('adminCode').value;

    if (!fullName || !email || !password || !adminCode) {
        showMessage('❌ Veuillez remplir tous les champs obligatoires.', 'error');
        return;
    }
    if (password !== passwordConfirm) {
        showMessage('❌ Les mots de passe ne correspondent pas.', 'error');
        return;
    }
    if (password.length < 6) {
        showMessage('❌ Le mot de passe doit contenir au moins 6 caractères.', 'error');
        return;
    }

    registerBtn.disabled = true;
    registerBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Création...';

    fetch('https://akpo-tech-solutions.vercel.app/api/admin/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password, fullName: fullName, phone: phone, adminCode: adminCode })
    }).then(function (response) {
        return response.json().catch(function () { return {}; }).then(function (payload) {
            if (!response.ok) {
                var error = new Error(payload.message || 'Impossible de créer le compte administrateur.');
                error.code = 'server/admin-register-' + response.status;
                throw error;
            }
            return payload;
        });
    }).then(function () {
        showMessage('✅ Compte administrateur créé. Vous pouvez maintenant vous connecter.', 'success');
        setTimeout(function () { window.location.href = 'admin-login.html'; }, 1500);
    }).catch(function (error) {
        console.error('[AKPO] Erreur inscription admin serveur:', error);
        showMessage(error.message || errorMessage(error), 'error');
        registerBtn.disabled = false;
        registerBtn.innerHTML = '<i class="bi bi-person-plus"></i> Créer le compte admin';
    });
});
</script>
</body>
</html>
