<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Admin | AKPO TECH SOLUTIONS</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../assets/logo/logo.png">
    <meta name="theme-color" content="#3B82F6">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <style>
        .auth-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0F172A 0%,#1E293B 50%,#0F172A 100%);padding:24px}.auth-card{background:white;border-radius:24px;padding:48px 40px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:440px}.auth-logo{text-align:center;margin-bottom:32px}.auth-logo img{height:48px}.auth-logo h1{font-size:1.5rem;font-weight:700;color:#0F172A;margin-top:16px}.auth-logo p{color:#94A3B8;font-size:.9rem}.admin-badge{display:inline-block;background:#3B82F6;color:white;padding:4px 16px;border-radius:50px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.auth-message{padding:12px 16px;border-radius:10px;font-size:.85rem;margin-bottom:16px;display:none}.auth-message.error{display:block;background:#FEF2F2;color:#EF4444;border:1px solid #FECACA}.auth-message.success{display:block;background:#F0FDF4;color:#16A34A;border:1px solid #BBF7D0}.form-group{margin-bottom:18px}.form-group .form-label{display:block;font-size:.85rem;font-weight:600;color:#0F172A;margin-bottom:6px}.form-control{width:100%;padding:12px 16px;border:2px solid #E2E8F0;border-radius:10px;font-size:.9rem;transition:all .3s;background:white}.form-control:focus{border-color:#3B82F6;outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.1)}.input-icon-wrapper{position:relative}.input-icon-wrapper input{padding-right:44px}.input-icon-wrapper .password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94A3B8;cursor:pointer}.auth-submit{width:100%;padding:14px;border-radius:50px;font-weight:600;font-size:.95rem;border:none;cursor:pointer;transition:all .3s;background:linear-gradient(135deg,#3B82F6,#60A5FA);color:white}.auth-submit:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 20px rgba(59,130,246,.35)}.auth-submit:disabled{opacity:.7;cursor:not-allowed}.auth-footer{text-align:center;margin-top:20px}.auth-footer a{color:#64748B;font-size:.85rem;text-decoration:none;transition:color .2s}.auth-footer a:hover{color:#3B82F6}
    </style>
</head>
<body>
<div class="auth-container"><div class="auth-card">
    <div class="auth-logo">
        <a href="../index.html"><img src="../assets/logo/logo.png" alt="AKPO TECH SOLUTIONS"></a>
        <span class="admin-badge"><i class="bi bi-shield-lock"></i> ADMINISTRATION</span>
        <h1>Créer un compte admin</h1><p>Réservé aux administrateurs du site</p>
    </div>
    <div class="auth-message" id="authMessage"></div>
    <form id="registerForm">
        <div class="form-group"><label class="form-label">Nom complet <span class="text-danger">*</span></label><input type="text" id="registerNom" class="form-control" placeholder="Votre nom complet" required></div>
        <div class="form-group"><label class="form-label">Email <span class="text-danger">*</span></label><input type="email" id="registerEmail" class="form-control" placeholder="admin@exemple.com" required></div>
        <div class="form-group"><label class="form-label">Téléphone</label><input type="tel" id="registerTéléphone" class="form-control" placeholder="Votre numéro"></div>
        <div class="form-group"><label class="form-label">Mot de passe <span class="text-danger">*</span></label><div class="input-icon-wrapper"><input type="password" id="registerPassword" class="form-control" placeholder="Min. 6 caractères" minlength="6" required><button type="button" class="password-toggle" onclick="togglePass('registerPassword', this)"><i class="bi bi-eye"></i></button></div></div>
        <div class="form-group"><label class="form-label">Confirmer le mot de passe <span class="text-danger">*</span></label><div class="input-icon-wrapper"><input type="password" id="registerPasswordConfirm" class="form-control" placeholder="Confirmez" minlength="6" required><button type="button" class="password-toggle" onclick="togglePass('registerPasswordConfirm', this)"><i class="bi bi-eye"></i></button></div></div>
        <button type="submit" class="auth-submit" id="registerBtn"><i class="bi bi-shield-lock"></i> Créer le compte admin</button>
    </form>
    <div class="auth-footer"><a href="admin-login.html"><i class="bi bi-arrow-left"></i> Retour à la connexion admin</a><br><a href="../index.html" class="mt-2 d-inline-block">Retour au site</a></div>
</div></div>
<script>
function togglePass(inputId,btn){const input=document.getElementById(inputId);const icon=btn.querySelector('i');if(input.type==='password'){input.type='text';icon.classList.replace('bi-eye','bi-eye-slash')}else{input.type='password';icon.classList.replace('bi-eye-slash','bi-eye')}}
function showMessage(text,type){const msg=document.getElementById('authMessage');msg.className='auth-message '+(type||'error');msg.textContent=text;msg.style.display='block'}
function hideMessage(){document.getElementById('authMessage').style.display='none'}
document.getElementById('registerForm').addEventListener('submit',async function(e){e.preventDefault();const nom=document.getElementById('registerNom').value.trim();const email=document.getElementById('registerEmail').value.trim();const telephone=document.getElementById('registerTéléphone').value.trim();const password=document.getElementById('registerPassword').value;const passwordConfirm=document.getElementById('registerPasswordConfirm').value;const btn=document.getElementById('registerBtn');hideMessage();if(!nom||!email||!password)return showMessage('❌ Veuillez remplir tous les champs obligatoires.','error');if(password!==passwordConfirm)return showMessage('❌ Les mots de passe ne correspondent pas.','error');if(password.length<6)return showMessage('❌ Le mot de passe doit contenir au moins 6 caractères.','error');btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm"></span> Création...';try{const response=await fetch('/api/admin/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,fullName:nom,phone:telephone})});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.message||'Erreur lors de la création du compte.');showMessage('✅ Compte administrateur créé avec succès ! Redirection...','success');setTimeout(()=>{window.location.href='../admin/index.html'},2000)}catch(error){console.error('❌ Erreur inscription admin:',error);showMessage('❌ '+(error.message||'Une erreur est survenue.'),'error');btn.disabled=false;btn.innerHTML='<i class="bi bi-shield-lock"></i> Créer le compte admin'}});
</script>
</body></html>
