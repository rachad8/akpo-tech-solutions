<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | AKPO TECH SOLUTIONS</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="icon" type="image/png" href="../assets/logo/logo.webp">
    <meta name="theme-color" content="#3B82F6">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/accessibility.css">
    <link rel="stylesheet" href="../assets/css/refonte-2026.css" data-akpo-refonte>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/session-guard.js"></script>
    
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #FFFFFF 0%, #EFF6FF 50%, #DBEAFE 100%);
            padding: 24px;
        }
        .auth-card {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 440px;
        }
        .auth-logo { text-align: center; margin-bottom: 32px; }
        .auth-logo img { height: 48px; }
        .auth-logo h1 { font-size: 1.5rem; font-weight: 700; color: #0F172A; margin-top: 16px; }
        .auth-logo p { color: #94A3B8; font-size: 0.9rem; }
        
        .auth-message { padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
        .auth-message.error { display: block; background: #FEF2F2; color: #EF4444; border: 1px solid #FECACA; }
        .auth-message.success { display: block; background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; }
        
        .auth-divider { display: flex; align-items: center; margin: 20px 0; color: #94A3B8; font-size: 0.8rem; }
        .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: #E2E8F0; }
        .auth-divider::before { margin-right: 16px; }
        .auth-divider::after { margin-left: 16px; }
        
        .auth-social-btn { width: 100%; padding: 12px; border-radius: 50px; font-weight: 600; font-size: 0.9rem; border: 2px solid #E2E8F0; background: white; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .auth-social-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .auth-social-btn.google-btn { border-color: #4285F4; color: #4285F4; }
        .auth-social-btn.google-btn:hover { background: #E8F0FE; }
        .auth-social-btn.email-btn { border-color: #3B82F6; color: #3B82F6; }
        .auth-social-btn.email-btn:hover { background: #EFF6FF; }
        
        .form-group { margin-bottom: 18px; }
        .form-group .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: #0F172A; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 16px; border: 2px solid #E2E8F0; border-radius: 10px; font-size: 0.9rem; transition: all 0.3s; background: white; }
        .form-control:focus { border-color: #3B82F6; outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper input { padding-right: 44px; }
        .input-icon-wrapper .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94A3B8; cursor: pointer; }
        
        .auth-submit { width: 100%; padding: 14px; border-radius: 50px; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; transition: all 0.3s; background: linear-gradient(135deg, #3B82F6, #60A5FA); color: white; }
        .auth-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35); }
        .auth-submit:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .auth-footer { text-align: center; margin-top: 20px; }
        .auth-footer a { color: #64748B; font-size: 0.85rem; text-decoration: none; transition: color 0.2s; }
        .auth-footer a:hover { color: #3B82F6; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-logo">
                <a href="../index.html"><img decoding="async" src="../assets/logo/logo.webp" alt="AKPO TECH SOLUTIONS"></a>
                <h1>Créer un compte</h1>
                <p>Inscrivez-vous gratuitement</p>
            </div>

            <div class="auth-message" id="authMessage"></div>

            
            <div id="authChoice">
                <button type="button" class="auth-social-btn google-btn" onclick="registerWithGoogle()">
                    <svg width="20" height="20" viewBox="0 0 48 48">
                        <path fill="#4285F4" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#34A853" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.96 16.46 0 20.12 0 24c0 3.88.96 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#EA4335" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    S'inscrire avec Google
                </button>

                <div class="auth-divider">ou</div>

                <button type="button" class="auth-social-btn email-btn" onclick="showEmailForm()">
                    <i class="bi bi-envelope"></i>
                    S'inscrire avec un email
                </button>
            </div>

            
            <div id="emailForm" style="display:none;">
                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label">Nom complet <span class="text-danger">*</span></label>
                        <input type="text" id="registerNom" class="form-control" placeholder="Votre nom complet" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email" id="registerEmail" class="form-control" placeholder="exemple@email.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Téléphone <span class="text-danger">*</span></label>
                        <input type="tel" id="registerTéléphone" class="form-control" placeholder="Votre numéro" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mot de passe <span class="text-danger">*</span></label>
                        <div class="input-icon-wrapper">
                            <input type="password" id="registerPassword" class="form-control" placeholder="Min. 6 caractères" minlength="6" required>
                            <button type="button" class="password-toggle" onclick="togglePass('registerPassword', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirmer <span class="text-danger">*</span></label>
                        <div class="input-icon-wrapper">
                            <input type="password" id="registerPasswordConfirm" class="form-control" placeholder="Confirmez" minlength="6" required>
                            <button type="button" class="password-toggle" onclick="togglePass('registerPasswordConfirm', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Vous êtes <span class="text-danger">*</span></label>
                        <select id="registerType" class="form-control" required>
                            <option value="">Sélectionnez...</option>
                            <option value="particulier">Particulier</option>
                            <option value="entreprise">Entreprise</option>
                        </select>
                    </div>
                    <button type="submit" class="auth-submit" id="registerBtn">
                        <i class="bi bi-person-plus"></i> Créer mon compte
                    </button>
                    <button type="button" class="btn btn-sm text-muted w-100 mt-2" onclick="hideEmailForm()">
                        <i class="bi bi-arrow-left"></i> Retour
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                <a href="login.html"><i class="bi bi-box-arrow-in-right"></i> Déjà un compte ? Se connecter</a>
                <br>
                <a href="../index.html" class="mt-2 d-inline-block">Retour au site</a>
            </div>

        </div>
    </div>

    <script>

        function showMessage(text, type) {
            var msg = document.getElementById('authMessage');
            msg.className = 'auth-message ' + (type || 'error');
            msg.textContent = text;
            msg.style.display = 'block';
        }

        function hideMessage() {
            document.getElementById('authMessage').style.display = 'none';
        }

        function togglePass(inputId, btn) {
            var input = document.getElementById(inputId);
            var icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        function showEmailForm() {
            document.getElementById('authChoice').style.display = 'none';
            document.getElementById('emailForm').style.display = 'block';
            hideMessage();
        }

        function hideEmailForm() {
            document.getElementById('authChoice').style.display = 'block';
            document.getElementById('emailForm').style.display = 'none';
            hideMessage();
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var nom = document.getElementById('registerNom').value.trim();
            var téléphone = document.getElementById('registerTéléphone').value.trim();
            var email = document.getElementById('registerEmail').value.trim();
            var password = document.getElementById('registerPassword').value;
            var passwordConfirm = document.getElementById('registerPasswordConfirm').value;
            var typeClient = document.getElementById('registerType').value;
            var btn = document.getElementById('registerBtn');

            hideMessage();

            if (!nom || !téléphone || !email || !password || !typeClient) {
                showMessage('❌ Veuillez remplir tous les champs obligatoires.', 'error');
                return;
            }

            if (password !== passwordConfirm) {
                showMessage('❌ Les mots de passe ne correspondent pas.', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('❌ Le mot de passe doit contenir au moins 6 caractères.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Création...';

            auth.createUserWithEmailAndPassword(email, password)
                .then(function(userCredential) {
                    return userCredential.user.updateProfile({ displayName: nom })
                        .then(function() {
                            return db.collection('clients').doc(userCredential.user.uid).set({
                                nom: nom,
                                email: email,
                                téléphone: téléphone,
                                typeClient: typeClient,
                                adresse: '',
                                photo: '',
                                dateInscription: firebase.firestore.FieldValue.serverTimestamp(),
                                statut: 'actif',
                                authProvider: 'email'
                            });
                        });
                })
                .then(function() {
                    showMessage('✅ Compte créé avec succès ! Redirection...', 'success');
                    setTimeout(function() {
                        window.location.href = '../client/index.html';
                    }, 1500);
                })
                .catch(function(error) {
                    console.error('❌ Erreur inscription:', error);
                    var message = '❌ Une erreur est survenue.';
                    if (error.code === 'auth/email-already-in-use') {
                        message = '❌ Cet email est déjà utilisé. <a href="login.html" class="fw-bold text-primary">Connectez-vous</a>';
                    } else if (error.code === 'auth/invalid-email') {
                        message = '❌ Adresse email invalide.';
                    } else if (error.code === 'auth/weak-password') {
                        message = '❌ Mot de passe trop faible (min. 6 caractères).';
                    } else if (error.code === 'auth/network-request-failed') {
                        message = '❌ Erreur de connexion. Vérifiez votre internet.';
                    } else {
                        message = '❌ ' + error.message;
                    }
                    showMessage(message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-person-plus"></i> Créer mon compte';
                });
        });

        function registerWithGoogle() {
            hideMessage();

            var provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('profile');
            provider.addScope('email');

            auth.signInWithPopup(provider)
                .then(function(result) {
                    if (result.additionalUserInfo.isNewUser) {
                        return db.collection('clients').doc(result.user.uid).set({
                            nom: result.user.displayName || '',
                            email: result.user.email,
                            téléphone: result.user.phoneNumber || '',
                            typeClient: 'particulier',
                            adresse: '',
                            photo: result.user.photoURL || '',
                            dateInscription: firebase.firestore.FieldValue.serverTimestamp(),
                            statut: 'actif',
                            authProvider: 'google'
                        });
                    }
                })
                .then(function() {
                    window.location.href = '../client/index.html';
                })
                .catch(function(error) {
                    console.error('❌ Erreur Google:', error);
                    if (error.code === 'auth/popup-blocked' || error.code === 'auth/popup-closed-by-user') {
                        showMessage('❌ Fenêtre fermée. Autorisez les popups.', 'error');
                    } else {
                        showMessage('❌ ' + error.message, 'error');
                    }
                });
        }
    </script>
</body>
</html>
