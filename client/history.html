    <style>
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-success { background: #10B981; }
        .toast-error { background: #EF4444; }
        .toast-info { background: #3B82F6; }
        .btn-action { padding: 4px 8px; font-size: 0.8rem; }
        
        .timeline-item {
            padding: 16px 20px;
            border-left: 3px solid #3B82F6;
            margin-bottom: 12px;
            background: white;
            border-radius: 0 12px 12px 0;
            border: 1px solid #E2E8F0;
            border-left-width: 4px;
            transition: all 0.2s;
        }
        .timeline-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .timeline-item .timeline-date {
            font-size: 0.75rem;
            color: #94A3B8;
        }
        .timeline-item .timeline-title {
            font-weight: 600;
            color: #0F172A;
        }
        .timeline-item .timeline-desc {
            font-size: 0.9rem;
            color: #475569;
        }
        .timeline-item .timeline-status {
            float: right;
        }
        .timeline-item.pending { border-left-color: #F59E0B; }
        .timeline-item.in-progress { border-left-color: #3B82F6; }
        .timeline-item.completed { border-left-color: #10B981; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

            </div>

        <main class="dashboard-main">
            
            <div class="dashboard-header">
                <h1><i class="bi bi-clock-history"></i> Historique</h1>
                <span class="text-muted">Toutes vos demandes passees</span>
            </div>

            
            <div class="d-flex gap-2 mb-3 flex-wrap">
                <button class="btn btn-sm btn-outline-primary active" onclick="filterHistory('tous')">Tous</button>
                <button class="btn btn-sm btn-outline-warning" onclick="filterHistory('en-attente')">En attente</button>
                <button class="btn btn-sm btn-outline-info" onclick="filterHistory('en-cours')">En cours</button>
                <button class="btn btn-sm btn-outline-success" onclick="filterHistory('termine')">Terminés</button>
                <button class="btn btn-sm btn-outline-danger" onclick="filterHistory('annule')">Annules</button>
            </div>

            
            <div id="historyList">
                <div class="text-center text-muted py-4">
                    <i class="bi bi-inbox fs-1 d-block"></i>
                    <p class="mt-2">Aucun historique trouvé</p>
                </div>
            </div>

        </main>
    </div>

    
    <div id="toast" class="toast-notification"></div>

    <script>

        
        
        

        let currentUser = null;
        let allHistory = [];

        AkpoGuard.requireAuth(async function(user, profile) {
            currentUser = user;
            await loadHistory();
            listenRealtime();
        });

        async function loadHistory() {
            const snapshot = await db.collection('clients').doc(currentUser.uid)
                .collection('demandes').orderBy('date', 'desc').get();

            allHistory = [];
            snapshot.forEach(doc => allHistory.push({ id: doc.id, ...doc.data() }));

            renderHistory();
        }

        function renderHistory(filtered) {
            const data = filtered || allHistory;
            const container = document.getElementById('historyList');

            if (data.length === 0) {
                container.innerHTML = '<div class="text-center text-muted py-4"><i class="bi bi-inbox fs-1 d-block"></i><p class="mt-2">Aucun historique trouvé</p></div>';
                return;
            }

            container.innerHTML = data.map(d => {
                const statusClass = d.statut === 'termine' ? 'completed' : d.statut === 'en-cours' ? 'in-progress' : 'pending';
                return `
                    <div class="timeline-item ${statusClass}">
                        <div class="timeline-status">
                            <span class="badge bg-${statusColor(d.statut)}">${statusLabel(d.statut)}</span>
                        </div>
                        <div class="timeline-title">${d.service}</div>
                        <div class="timeline-desc">${d.description || 'Aucune description'}</div>
                        <div class="timeline-date">
                            <i class="bi bi-geo-alt"></i> ${d.adresse || 'Adresse non specifiee'} | 
                            <i class="bi bi-calendar"></i> ${formatDate(d.date)}
                            ${d.urgence ? `| <span class="badge bg-${urgenceClass(d.urgence)}">${urgenceLabel(d.urgence)}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterHistory(status) {

            document.querySelectorAll('.btn-outline-primary, .btn-outline-warning, .btn-outline-info, .btn-outline-success, .btn-outline-danger')
                .forEach(btn => btn.classList.remove('active'));
            
            if (status === 'tous') {
                document.querySelector('.btn-outline-primary').classList.add('active');
                renderHistory(allHistory);
            } else {
                document.querySelector(`[onclick*="${status}"]`).classList.add('active');
                renderHistory(allHistory.filter(d => d.statut === status));
            }
        }

        async function handleLogout() {
            await AkpoGuard.logout('../auth/login.html');
        }

        function listenRealtime() {
            db.collection('clients').doc(currentUser.uid).collection('demandes')
                .orderBy('date', 'desc')
                .onSnapshot(snapshot => {
                    allHistory = [];
                    snapshot.forEach(doc => allHistory.push({ id: doc.id, ...doc.data() }));
                    renderHistory();
                });
        }
