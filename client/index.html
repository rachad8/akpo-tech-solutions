<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord | AKPO TECH SOLUTIONS</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="icon" type="image/png" href="../assets/logo/logo.webp">
    <meta name="theme-color" content="#3B82F6">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/session-guard.js"></script>
</head>
<body>

    <div class="dashboard-layout">
        
        <aside class="dashboard-sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img decoding="async" src="../assets/logo/logo.webp" alt="AKPO TECH">
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="sidebar-link active"><i class="bi bi-speedometer2"></i> Tableau de bord</a>
                <a href="profile.html" class="sidebar-link"><i class="bi bi-person"></i> Mon profil</a>
                <a href="invoices.html" class="sidebar-link"><i class="bi bi-receipt"></i> Factures</a>
                <a href="payments.html" class="sidebar-link"><i class="bi bi-credit-card"></i> Paiements</a>
                <a href="history.html" class="sidebar-link"><i class="bi bi-clock-history"></i> Historique</a>
                <a href="support.html" class="sidebar-link"><i class="bi bi-headset"></i> Support</a>
                <a href="settings.html" class="sidebar-link"><i class="bi bi-gear"></i> Paramètres</a>
            </nav>
            <div style="margin-top:auto;">
                <a href="../index.html" class="sidebar-link" style="color:#94A3B8;"><i class="bi bi-arrow-left"></i> Retour au site</a>
                <button class="sidebar-logout" onclick="handleLogout()"><i class="bi bi-box-arrow-right"></i> Déconnexion</button>
            </div>
        </aside>

        
        <main class="dashboard-main">
            <div class="dashboard-header">
                <div><h1>Bienvenue <span id="clientName">Client</span> !</h1><p class="text-muted">Voici le résumé de votre activité.</p></div>
                <button class="btn btn-primary" onclick="showNewDemande()"><i class="bi bi-plus-circle"></i> Nouvelle demande</button>
            </div>

            <div class="dashboard-stats">
                <div class="dashboard-stat-card"><div class="dashboard-stat-icon bg-primary bg-opacity-10 text-primary"><i class="bi bi-list-check"></i></div><div><div class="dashboard-stat-value" id="statTotal">0</div><div class="dashboard-stat-label">Total demandes</div></div></div>
                <div class="dashboard-stat-card"><div class="dashboard-stat-icon bg-warning bg-opacity-10 text-warning"><i class="bi bi-clock"></i></div><div><div class="dashboard-stat-value" id="statEnAttente">0</div><div class="dashboard-stat-label">En attente</div></div></div>
                <div class="dashboard-stat-card"><div class="dashboard-stat-icon bg-info bg-opacity-10 text-info"><i class="bi bi-hourglass-split"></i></div><div><div class="dashboard-stat-value" id="statEnCours">0</div><div class="dashboard-stat-label">En cours</div></div></div>
                <div class="dashboard-stat-card"><div class="dashboard-stat-icon bg-success bg-opacity-10 text-success"><i class="bi bi-check-circle"></i></div><div><div class="dashboard-stat-value" id="statTermine">0</div><div class="dashboard-stat-label">Terminées</div></div></div>
            </div>

            <div class="dashboard-table-card">
                <div class="dashboard-table-header"><h3>Dernières demandes</h3></div>
                <div class="table-responsive"><table class="dashboard-table"><thead><tr><th>Réf</th><th>Service</th><th>Date</th><th>Statut</th></tr></thead><tbody id="recentDemandes"></tbody></table></div>
            </div>
        </main>
    </div>

    <script>

        
        
        

        let currentUser = null;

        AkpoGuard.requireAuth(async function(user, profile) {

            currentUser = user;
            
            try {
                const doc = await db.collection('clients').doc(user.uid).get();
                if (doc.exists) {
                    const nom = doc.data().nom || 'Client';
                    document.getElementById('clientName').textContent = nom.split(' ')[0];
                } else {
                    document.getElementById('clientName').textContent = 'Client';
                }
                
                loadDashboard();
            } catch (error) {
                console.error('❌ Erreur chargement profil:', error);
                document.getElementById('clientName').textContent = 'Client';
                loadDashboard();
            }
        });

        async function loadDashboard() {
            if (!currentUser) return;

            try {
                const snapshot = await db.collection('clients').doc(currentUser.uid)
                    .collection('demandes').orderBy('date', 'desc').get();
                
                const demandes = [];
                snapshot.forEach(doc => demandes.push({ id: doc.id, ...doc.data() }));

                document.getElementById('statTotal').textContent = demandes.length;
                document.getElementById('statEnAttente').textContent = demandes.filter(d => d.statut === 'en-attente').length;
                document.getElementById('statEnCours').textContent = demandes.filter(d => d.statut === 'en-cours').length;
                document.getElementById('statTermine').textContent = demandes.filter(d => d.statut === 'termine').length;

                const recent = demandes.slice(0, 5);
                document.getElementById('recentDemandes').innerHTML = recent.length === 0 
                    ? '<tr><td colspan="4" class="text-center py-3 text-muted">Aucune demande</td></tr>'
                    : recent.map(d => `
                        <tr>
                            <td><strong>${d.id}</strong></td>
                            <td>${d.service}</td>
                            <td>${formatDate(d.date)}</td>
                            <td><span class="badge bg-${statusColor(d.statut)}">${statusLabel(d.statut)}</span></td>
                        </tr>
                    `).join('');
            } catch (error) {
                console.error('❌ Erreur chargement demandes:', error);
            }
        }

        function showNewDemande() {
            const service = prompt('Service demandé :', 'Dépannage informatique');
            if (!service) return;
            const adresse = prompt('Adresse d\'intervention :');
            if (!adresse) return;
            const description = prompt('Description :') || '';
            
            const id = 'AKPO-' + Date.now().toString(36).toUpperCase();
            db.collection('clients').doc(currentUser.uid).collection('demandes').doc(id).set({
                id, service, adresse, description,
                urgence: 'normal', statut: 'en-attente',
                date: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert('✅ Demande créée : ' + id);
                loadDashboard();
            }).catch(error => {
                alert('❌ Erreur : ' + error.message);
            });
        }

        async function handleLogout() {
            await AkpoGuard.logout('../auth/login.html');
        }

        function formatDate(d) {
            if (!d) return '';
            const dt = d.toDate ? d.toDate() : new Date(d);
            return dt.toLocaleDateString('fr-FR', {day:'2-digit',month:'short',year:'numeric'});
        }

        function statusLabel(s) {
            const l = {'en-attente':'En attente','en-cours':'En cours','termine':'Terminé','annule':'Annulé'};
            return l[s] || s;
        }

        function statusColor(s) {
            const c = {'en-attente':'warning','en-cours':'info','termine':'success','annule':'danger'};
            return c[s] || 'secondary';
        }
    </script>
    <script src="../assets/js/dashboard-mobile.js"></script>
</body>
</html>
