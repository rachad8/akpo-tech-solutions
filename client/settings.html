<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres | AKPO TECH SOLUTIONS</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="icon" type="image/png" href="../assets/logo/logo.webp">
    <meta name="theme-color" content="#3B82F6">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/session-guard.js"></script>
</head>
<body>

    <div class="dashboard-layout">
        <aside class="dashboard-sidebar">
            <div class="sidebar-brand"><img decoding="async" src="../assets/logo/logo.webp" alt="AKPO TECH"></div>
            <nav class="sidebar-nav">
                <a href="index.html" class="sidebar-link"><i class="bi bi-speedometer2"></i> Tableau de bord</a>
                <a href="profile.html" class="sidebar-link"><i class="bi bi-person"></i> Mon profil</a>
                <a href="invoices.html" class="sidebar-link"><i class="bi bi-receipt"></i> Factures</a>
                <a href="payments.html" class="sidebar-link"><i class="bi bi-credit-card"></i> Paiements</a>
                <a href="history.html" class="sidebar-link"><i class="bi bi-clock-history"></i> Historique</a>
                <a href="support.html" class="sidebar-link"><i class="bi bi-headset"></i> Support</a>
                <a href="settings.html" class="sidebar-link active"><i class="bi bi-gear"></i> Paramètres</a>
            </nav>
            <button class="sidebar-logout" onclick="AkpoGuard.logout('../auth/login.html')"><i class="bi bi-box-arrow-right"></i> Déconnexion</button>
        </aside>

        <main class="dashboard-main">
            <div class="dashboard-header"><h1>Paramètres</h1></div>

            <div class="card mb-4">
                <h4 class="mb-3">Changer le mot de passe</h4>
                <form id="passwordForm">
                    <div class="mb-3"><label class="form-label">Mot de passe actuel</label><input type="password" class="form-control" id="currentPassword" required></div>
                    <div class="mb-3"><label class="form-label">Nouveau mot de passe</label><input type="password" class="form-control" id="newPassword" minlength="6" required></div>
                    <div class="mb-3"><label class="form-label">Confirmer</label><input type="password" class="form-control" id="confirmPassword" minlength="6" required></div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-shield-check"></i> Modifier</button>
                </form>
                <div id="passwordMsg" class="mt-2 small"></div>
            </div>

            <div class="card">
                <h4 class="mb-3 text-danger">Zone dangereuse</h4>
                <p class="text-muted small">Supprimer définitivement votre compte et toutes vos données.</p>
                <button class="btn btn-outline-danger" onclick="if(confirm('Supprimer votre compte ? Cette action est irréversible.'))alert('Contactez le support pour supprimer votre compte.')">
                    <i class="bi bi-trash"></i> Supprimer mon compte
                </button>
            </div>
        </main>
    </div>

    <script>

        
        

        AkpoGuard.requireAuth();

        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const current = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('passwordMsg');

            if (newPass !== confirm) { msg.textContent = 'Les mots de passe ne correspondent pas.'; msg.className = 'text-danger'; return; }
            if (newPass.length < 6) { msg.textContent = 'Minimum 6 caractères.'; msg.className = 'text-danger'; return; }

            try {
                const credential = firebase.auth.EmailAuthProvider.credential(auth.currentUser.email, current);
                await auth.currentUser.reauthenticateWithCredential(credential);
                await auth.currentUser.updatePassword(newPass);
                msg.textContent = 'Mot de passe modifié avec succès !';
                msg.className = 'text-success';
                e.target.reset();
            } catch (error) {
                msg.textContent = 'Mot de passe actuel incorrect.';
                msg.className = 'text-danger';
            }
        });
    </script>
    <script src="../assets/js/dashboard-mobile.js"></script>
</body>
</html>
